<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/login.css">
    <title>Login GreenSync</title>
</head>

<body>

    <div class="container-login">

        <div class="img-box">
            <img src="IMG/Login-amico.svg" alt="Imagem-Homem-Login">
        </div>

        <div class="content-box">
            <div class="form-box">
                <h2>Login</h2>
                <form action="">

                    <div class="input-box">
                        <span>Usuário</span>
                        <input type="email" placeholder="Nome" name="nome">
                    </div>

                    <div class="input-box">
                        <span>Código do produto</span>
                        <input type="password" placeholder="#a0a0a0" name="codigo">
                    </div>

                    <div class="remember">
                        <label>
                            <input type="checkbox" name="lembreMe"> Lembre de mim
                        </label>
                    </div>

                    <div class="input-box">
                        <input type="submit" value="Entrar" class="button">
                    </div>

                </form>
                <h3>Logar Com</h3>

                <ul class="ul">
                    <li><img src="IMG/FB-f-Logo__blue_512.png" alt="Facebook-Logo"></li>
                    <li><img src="IMG/Logo-Google-G.png" alt="Google-Logo"></li>
                    <li><img src="IMG/apple-logo.png" alt="Apple-Logo"></li>
                </ul>
                
            </div>
        </div>

    </div>

</body>

</html>
