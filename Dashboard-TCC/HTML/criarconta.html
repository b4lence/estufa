<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/login.css">
    <title>Criar Conta GreenSync</title>
</head>

<body>

    <div class="container-login">

        <div class="img-box">
            <img src="IMG/Tablet login-bro.svg" alt="Imagem-Homem-Login">
        </div>

        <div class="content-box">

            <div class="form-box">
                <h2>Criar Conta</h2>
                <form action="" method="post">

                    <div class="input-box">
                        <span>Usuário</span>
                        <input type="email" placeholder="@mail.com">
                    </div>

                    <div class="input-box">
                        <span>Senha</span>
                        <input type="password" placeholder="senha">
                    </div>

                    <div class="remember">
                        <label>
                            <input type="checkbox"> Remember me
                        </label>
                    </div>

                    <div class="input-box">
                        <input type="submit" value="Criar" class="button">
                    </div>

                    <div class="input-box">
                        <p>Já tem uma conta? <a href="login.html">Login</a></p>   
                    </div>

                </form>
            </div>

        </div>

    </div>

</body>

</html>
